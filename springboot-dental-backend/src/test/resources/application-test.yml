spring:
  datasource:
    url: jdbc:mysql://localhost:3306/dental_clinic_test?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  sql:
    init:
      mode: never

logging:
  level:
    com.clinic.dental: warn

security:
  token:
    secret: dental-test-token-secret-must-be-at-least-32-characters-long
    expiration-seconds: 3600