server:
  port: 8080

spring:
  application:
    name: dental-clinic
  datasource:
    url: jdbc:mysql://localhost:3306/dental_clinic?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never
      encoding: UTF-8

security:
  token:
    # 本地演示默认密钥；生产部署必须通过 DENTAL_TOKEN_SECRET 提供随机且保密的 32+ 字符密钥。
    secret: ${DENTAL_TOKEN_SECRET:replace-this-local-demo-secret-with-at-least-32-characters}
    expiration-seconds: ${DENTAL_TOKEN_EXPIRATION_SECONDS:28800}

# 日志级别
logging:
  level:
    com.clinic.dental: info
